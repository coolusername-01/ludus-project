---
- name: Update packages
  ansible.builtin.apt:
    update_cache: true

- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx

- name: Copy website files to nginx folder
  ansible.builtin.copy:
    src: /files/
    dest: /etc/var/www/mywebsite

- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: Restart nginx

- name: Start nginx and enable at boot
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started